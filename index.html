<!doctype html>
<meta charset="UTF-8" />
<meta
  name="description"
  content="A simple web application to share bookmarks among users."
/>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <title>Shared Bookmarks Project</title>
    <script type="module" src="./script.js"></script>
    <link rel="stylesheet" href="./style.css" />
  </head>
  <body>
    <header>
      <h1>Shared Bookmarks</h1>
    </header>
    <main>

      <section id="user-dropdown-section"></section>

      <section>
        <h2>Add Bookmark</h2>

        <form id="bookmark-form" aria-describedby="form-help">
          <div>
            <label for="link">URL:</label>
            <input type="url" id="link" name="link" required />
          </div>

          <div>
            <label for="title">Title:</label>
            <input type="text" id="title" name="title" required />
          </div>

          <div>
            <label for="desc">Description:</label>
            <input type="text" id="desc" name="desc" required />
          </div>

          <button type="submit">Save Bookmark</button>
        </form>
          
      </section>
      
      <section>
        <ul id="bookmarks-list"></ul>
      </section>

    </main>
    
  </body>
</html>
